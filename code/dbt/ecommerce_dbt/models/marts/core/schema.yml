version: 2

models:
  - name: dim_customers
    description: "Dimension table for customers"
    columns:
      - name: customer_id
        tests: [not_null, unique] # Not null and unique tests on the primary keys of the dimension tables 

  - name: dim_sellers 
    columns: 
      - name: seller_id
        tests: [not_null, unique]

  - name: dim_products
    columns: 
      - name: product_id
        tests: [not_null, unique]

  - name: fct_sales
    description: "Main sales table at order-item granularity"
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_item_key
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - relationships:  # Relationship tests on the foreign keys of the fact tables to ensure referential integrity
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')  
                field: product_id
      - name: seller_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: price 
        tests: [column_positive_test]

  - name: fct_reviews 
    columns: 
      - name: customer_id 
        tests: 
          - relationships: 
              arguments:
                to: ref('dim_customers')
                field: customer_id 
      - name: product_id 
        tests: 
          - relationships: 
              arguments:
                 to: ref('dim_products')
                 field: product_id
      - name: seller_id
        tests: 
          - relationships: 
              arguments:
                to: ref('dim_sellers')
                field: seller_id

  - name: fct_payments 
    columns: 
      - name: customer_id 
        tests: 
          - relationships: 
              arguments:
                to: ref('dim_customers')
                field: customer_id
        

